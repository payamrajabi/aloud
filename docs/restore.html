<!doctype html>
<html lang="en">
<head>
<title>Find your Aloud license</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
  :root { --bg: #f5f5f7; --surface: #fff; --ink: #1d1d1f; --muted: #6e6e73; --line: rgba(0,0,0,.09); --cta: #1d1d1f; --cta-ink: #fff; --code: #f5f5f7; --bad: #c4321f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0c0d; --surface: #1c1c1e; --ink: #f5f5f7; --muted: #98989d; --line: rgba(255,255,255,.12); --cta: #f5f5f7; --cta-ink: #1d1d1f; --code: #2c2c2e; --bad: #ff6b5a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { width: 100%; max-width: 30rem; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px; text-align: center; }
  .card img { width: 64px; height: 64px; }
  h1 { font: 600 26px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; margin: 12px 0 8px; text-wrap: balance; }
  p { color: var(--muted); margin: 0 0 16px; }
  .btn { display: inline-block; background: var(--cta); color: var(--cta-ink); text-decoration: none; font-weight: 600; border: 0; cursor: pointer;
         padding: 12px 22px; border-radius: 999px; font-size: 16px; font-family: inherit; }
  .key { font: 12px/1.45 ui-monospace, Menlo, monospace; word-break: break-all; background: var(--code); border-radius: 10px; padding: 10px 12px; text-align: left; color: var(--ink); user-select: all; margin: 0 0 8px; }
  .small { font-size: 13px; }
  .small a, p a { color: inherit; }
  input { width: 100%; font: inherit; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 0 0 12px; }
  .error { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <img src="assets/icon.svg" alt="">
  <h1>Find your license</h1>
  <form id="form">
    <p>Enter the email address you bought Aloud with, and we’ll send your license there.</p>
    <input type="email" name="email" required autocomplete="email" placeholder="you@example.com" aria-label="Email address">
    <button class="btn" type="submit">Email My License</button>
    <p class="small error" id="error" hidden></p>
  </form>
  <div id="sent" hidden>
    <p>If that address bought Aloud, its license is on its way. Check your inbox, and your spam folder just in case.</p>
    <p class="small">Still stuck? Write to <a href="mailto:hello@aloudformac.com">hello@aloudformac.com</a>.</p>
  </div>
</main>
<script>
  const form = document.getElementById("form"), error = document.getElementById("error");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = form.querySelector("button");
    button.disabled = true;
    error.hidden = true;
    try {
      const res = await fetch("/api/restore", { method: "POST", body: new FormData(form) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      form.hidden = true;
      document.getElementById("sent").hidden = false;
    } catch (e) {
      error.textContent = e.message + " Please try again.";
      error.hidden = false;
      button.disabled = false;
    }
  });
</script>
</body>
</html>
